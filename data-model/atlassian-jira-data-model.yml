  OpenAPI definitions harvested 2026-09-06 (platform swagger-v3.v3.json, software swagger.v3.json,
  service-desk swagger.v3.json). Entity descriptions taken from the specs' own schema descriptions.
root_entity: IssueBean
identifier_conventions:
- name: issue key
  form: <PROJECTKEY>-<number>
  example_pattern: 'ABC-123'
  note: Most issue operations accept issueIdOrKey, so either the numeric id or the human key resolves.
- name: project key
  form: uppercase alphanumeric
  note: Project operations accept projectIdOrKey.
- name: accountId
  form: opaque Atlassian account identifier
  note: Replaced username/userKey across the API under the user-privacy migration; usernames are no longer accepted.
- name: cloudId
  form: uuid
  note: Required when calling Jira through api.atlassian.com/ex/jira/{cloudId} with a 3LO token.
