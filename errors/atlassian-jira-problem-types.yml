source: |
  Derived from the first-party Atlassian OpenAPI definitions harvested 2026-09-06 —
  developer.atlassian.com/cloud/jira/platform/swagger-v3.v3.json,
  /cloud/jira/software/swagger.v3.json and /cloud/jira/service-desk/swagger.v3.json.
  Titles and remediation enriched from the Jira Cloud REST API intro and rate-limiting docs.
format: atlassian-error-collection
format_note: |
  Jira does NOT emit RFC 9457 application/problem+json. Errors are returned as an Atlassian
  ErrorCollection envelope with application/json.
envelope:
  media_type: application/json
  shape: ErrorCollection
  fields:
  - name: errorMessages
    type: array<string>
    description: Human-readable error messages not tied to a specific field.
  - name: errors
    type: object
    description: Map of field name to the validation message for that field.
  - name: warningMessages
    type: array<string>
    description: Non-fatal warnings returned alongside a successful or partial response.
  - name: status
    type: integer
    description: HTTP status echoed by some Service Management and Software endpoints (ErrorResponse shape).
rfc9457: false
