source: |
  Versioning, deprecation policy, changelog and status page searched on the Atlassian developer and
  trust surfaces 2026-09-06. Deprecated operations below are read straight from the `deprecated: true`
  flags in the first-party OpenAPI definitions harvested the same day — not from prose.
versioning:
  style: path
  current: '3'
  pattern: /rest/api/{version}
  docs: https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/
deprecation_policy:
  published: true
  url: https://developer.atlassian.com/platform/marketplace/atlassian-rest-api-policy/
  notice_period: P6M
  detail: |
    Atlassian's REST API policy commits to keeping any deprecated cloud REST API available in its
    original form for at least six months, with a stated exception for critical security
    vulnerabilities, critical reliability issues and data-integrity issues, where the period may be
    shortened. Deprecations are announced with a removal date in the developer changelog before they
    take effect.
  sunset_header: unknown
  sunset_header_note: |
    Atlassian publishes deprecation dates in the changelog and in the API reference rather than in
    RFC 8594 Sunset / Deprecation response headers. No Sunset or Deprecation header appears in any of
    the three harvested specifications, and none was observed on a live response.
changelog:
  url: https://developer.atlassian.com/changelog/
  status: 200
  detail: changelog/atlassian-jira-changelog.yml
status_page:
  url: https://status.atlassian.com/
  vendor: Atlassian Statuspage
  api: https://status.atlassian.com/api/v2/summary.json
sla:
  published: true
  uptime:
