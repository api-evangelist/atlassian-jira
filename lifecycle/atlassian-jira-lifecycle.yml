experimental_note: |
  115 platform operations and 15 Service Management operations carry x-experimental: true in the
  harvested specs. Atlassian's REST API policy explicitly excludes experimental endpoints from the
  six-month deprecation guarantee, so an integration that binds to one is unprotected.
notable_deprecations:
- name: Jira REST API v2
  status: deprecated
  replacement: /rest/api/3 (Atlassian Document Format bodies)
  migration_guide: https://developer.atlassian.com/cloud/jira/platform/rest/v3/intro/
- name: Basic authentication with passwords and cookie-based authentication
  status: removed
  replacement: API tokens over HTTP Basic, or OAuth 2.0 (3LO)
  notice: https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-basic-auth-and-cookie-based-auth/
- name: username and userKey identifiers
  status: removed
  replacement: accountId
  notice: https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-user-privacy-api-migration-guide/
- name: Non-paginated GET /rest/api/3/filter and GET /rest/api/3/project
  status: deprecated
  replacement: getFiltersPaginated / searchProjects
  notice: https://developer.atlassian.com/cloud/jira/platform/deprecation-notice-removal-of-get-filters-and-get-all-projects/
