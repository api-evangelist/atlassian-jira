repository: https://github.com/atlassian/atlassian-mcp-server
third_party_note: |
  The npm package `atlassian-mcp-server` (latest 1.0.1, 2025-12-12) is NOT Atlassian's — it is
  published by the `teo-lin` account from github.com/teo-lin/multi-llm-mcps and is recorded here only
  so it is not mistaken for a first-party stdio distribution. Atlassian ships no first-party stdio
  MCP package; the product is the hosted endpoint above.
