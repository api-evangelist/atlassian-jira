specification: API Commons MCPServer
specificationVersion: '0.1'
provider: Atlassian Jira
providerId: atlassian-jira
name: Atlassian Remote MCP Server (Rovo MCP Server)
generated: '2026-09-06'
method: searched
status: published
source: |
  Provider-published. The server is announced at https://www.atlassian.com/platform/remote-mcp-server
  and documented at https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/.
  Endpoints were probed directly on 2026-09-06: an unauthenticated JSON-RPC tools/list POST to
  https://mcp.atlassian.com/v1/mcp/authv2 returns HTTP 401 with
  WWW-Authenticate: Bearer resource_metadata="https://mcp.atlassian.com/.well-known/oauth-protected-resource/v1/mcp/authv2",
  which is a live OAuth-protected MCP surface, not a missing one. The tool inventory below is
  therefore the provider's own published list, not a live tools/list response — schemas require an
  authenticated introspection this pipeline does not perform.
deployment:
  mode: remote
  endpoint: https://mcp.atlassian.com/v1/mcp/authv2
  auth: oauth
  verified: probed
alternate_endpoints:
- url: https://mcp.atlassian.com/v2/mcp
  transport: streamable-http
  status: 401
  note: v2 endpoint named in the supported-tools documentation; accepts a ?tools=all override that
    returns every tool as a paginated flat list instead of the default deferred-tool set.
- url: https://mcp.atlassian.com/v1/mcp
  transport: streamable-http
  status: 401
- url: https://mcp.atlassian.com/v1/sse
  transport: sse
  status: 401
  note: The original SSE endpoint, still live and still returning an OAuth challenge.
oauth:
  authorization_server: https://mcp.atlassian.com
  authorization_server_metadata: https://mcp.atlassian.com/.well-known/oauth-authorization-server
  protected_resource_metadata: https://mcp.atlassian.com/.well-known/oauth-protected-resource/v1/mcp/authv2
  dynamic_client_registration: https://mcp.atlassian.com/v1/register
  pkce: [S256, plain]
  upstream_authorization_server: https://auth.atlassian.com/VCeDsk8ZHncYF1g234fKtc4lNipbBhu3
  scopes_supported:
  - read:me
  - read:account
  - offline_access
  - email
  - read:jira-work
  - write:jira-work
  - search:confluence
  - read:confluence-user
  - read:page:confluence
  - write:page:confluence
  - read:comment:confluence
  - write:comment:confluence
  - read:space:confluence
  - read:hierarchical-content:confluence
  - write:component:compass
  - read:component:compass
  - read:scorecard:compass
  - write:scorecard:compass
  - read:event:compass
  - read:metric:compass
  - read:all:twg
  - write:all:twg
