tool_count_total: 57
tool_count_jira_and_jsm: 50
tool_count_common: 7
tool_count_note: |
  Jira/JSM tools plus the server's common tools. The full server also exposes Confluence, Bitbucket,
  Compass, Loom, Goals, Projects, Teams, Focus, Talent and Teamwork Graph toolsets, which belong to
  sibling Atlassian products and are not enumerated in this Jira record.
schemas_available: false
schemas_note: |
  inputSchema values are not recorded here. tools/list is OAuth-gated (HTTP 401 anonymously), so the
  real schemas require an authenticated introspection against a Jira Cloud tenant. The REST
  operations each tool most likely binds to are recorded in mcp/atlassian-jira-tool-crosswalk.yml,
  where the OpenAPI parameters and requestBody stand in for the tool's real inputSchema.
