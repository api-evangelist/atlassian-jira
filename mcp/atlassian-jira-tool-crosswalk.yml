rest_only:
  operation_count: 716
  note: |
    The Jira REST surface is far larger than the MCP tool surface. 781 operations are
    published across the three specs and only 65 are reachable through a named Jira MCP tool.
    Everything else — workflow, screen, field-configuration, permission-scheme, security-scheme,
    notification-scheme, audit, JQL-function, app-property and bulk administration — has no tool and
    must be called over REST.
coverage:
  openapi_operations: 781
  mcp_jira_tools: 46
  tools_bound_to_rest: 46
  operations_reachable_via_tool: 65
  mcp_only_tools: 11
  rest_only_operations: 716
  percent_operations_tool_reachable: 8.3
