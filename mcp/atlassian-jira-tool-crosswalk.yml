specification: API Commons ToolCrosswalk
specificationVersion: '0.1'
provider: Atlassian Jira
providerId: atlassian-jira
generated: '2026-09-06'
method: derived
source: |
  Binds the published Atlassian Remote MCP Server Jira tool names
  (https://support.atlassian.com/atlassian-rovo-mcp-server/docs/supported-tools/) to the operationIds
  in the first-party Atlassian OpenAPI definitions harvested 2026-09-06. Every operationId below was
  grepped out of the saved specs; any tool whose expected operationId was NOT found in a spec is
  recorded in unresolved_rest[] rather than being invented. The live MCP tools/list is OAuth-gated
  (HTTP 401 anonymously), so the binding is by name and documented semantics, not by comparing
  inputSchema to parameters — confidence is set accordingly.
surfaces:
- kind: openapi
  name: Jira Cloud platform REST API v3
  file: openapi/atlassian-jira-platform-openapi.json
  gated: false
- kind: openapi
  name: Jira Software Cloud API
  file: openapi/atlassian-jira-software-openapi.json
  gated: false
- kind: openapi
  name: Jira Service Management REST API
  file: openapi/atlassian-jira-service-management-openapi.json
  gated: false
- kind: mcp
  name: Atlassian Remote MCP Server
  url: https://mcp.atlassian.com/v1/mcp/authv2
  gated: true
  gate: OAuth 2.1 bearer; anonymous tools/list returns 401 invalid_token
- kind: graphql
  name: Atlassian GraphQL Gateway
  url: https://api.atlassian.com/graphql
  gated: true
  gate: Requires an authenticated Atlassian token; introspection was not attempted anonymously.
