openapi: 3.1.0
info:
  title: Atlassian Jira Cloud Platform REST API v3
  description: |
    Best-effort OpenAPI 3.1 description of the Atlassian Jira Cloud platform REST API
    (version 3). This spec covers a representative subset of issue, project, user,
    search, comment and workflow operations. Derived from the public developer
    documentation at https://developer.atlassian.com/cloud/jira/platform/rest/v3/.
  version: "3"
  contact:
    name: Atlassian Developer
    url: https://developer.atlassian.com/cloud/jira/platform/rest/v3/
servers:
  - url: https://{your-domain}.atlassian.net
    description: Jira Cloud site
    variables:
      your-domain:
        default: example
        description: Your Atlassian site domain
tags:
  - name: Issues
    description: Create, read, update and delete Jira issues.
  - name: Issue Search
    description: Search issues using JQL.
  - name: Issue Comments
    description: Manage comments on issues.
  - name: Issue Worklogs
    description: Manage worklogs on issues.
  - name: Issue Transitions
    description: List and perform workflow transitions.
  - name: Projects
    description: Manage Jira projects.
  - name: Users
    description: Read user information.
  - name: Fields
    description: Read Jira field metadata.
paths:
  /rest/api/3/issue/{issueIdOrKey}:
    get:
      tags: [Issues]
      summary: Get issue
      operationId: getIssue
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '200':
          description: Issue returned
    put:
      tags: [Issues]
      summary: Edit issue
      operationId: editIssue
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '204':
          description: Issue updated
    delete:
      tags: [Issues]
      summary: Delete issue
      operationId: deleteIssue
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '204':
          description: Issue deleted
  /rest/api/3/issues:
    post:
      tags: [Issues]
      summary: Bulk create issues
      operationId: createIssues
      responses:
        '201':
          description: Issues created
  /rest/api/3/search:
    get:
      tags: [Issue Search]
      summary: Search for issues using JQL (GET)
      operationId: searchForIssuesUsingJql
      parameters:
        - in: query
          name: jql
          schema:
            type: string
        - in: query
          name: startAt
          schema:
            type: integer
        - in: query
          name: maxResults
          schema:
            type: integer
      responses:
        '200':
          description: Search results
  /rest/api/3/project:
    get:
      tags: [Projects]
      summary: Get all projects
      operationId: getAllProjects
      responses:
        '200':
          description: Projects returned
    post:
      tags: [Projects]
      summary: Create project
      operationId: createProject
      responses:
        '201':
          description: Project created
  /rest/api/3/project/{projectIdOrKey}:
    get:
      tags: [Projects]
      summary: Get project
      operationId: getProject
      parameters:
        - in: path
          name: projectIdOrKey
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Project returned
  /rest/api/3/user:
    get:
      tags: [Users]
      summary: Get user
      operationId: getUser
      parameters:
        - in: query
          name: accountId
          schema:
            type: string
      responses:
        '200':
          description: User returned
  /rest/api/3/issue/{issueIdOrKey}/comment:
    get:
      tags: [Issue Comments]
      summary: Get comments
      operationId: getComments
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '200':
          description: Comments returned
    post:
      tags: [Issue Comments]
      summary: Add comment
      operationId: addComment
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '201':
          description: Comment added
  /rest/api/3/issue/{issueIdOrKey}/comment/{id}:
    put:
      tags: [Issue Comments]
      summary: Update comment
      operationId: updateComment
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment updated
  /rest/api/3/field:
    get:
      tags: [Fields]
      summary: Get fields
      operationId: getFields
      responses:
        '200':
          description: Fields returned
  /rest/api/3/issue/{issueIdOrKey}/worklog:
    post:
      tags: [Issue Worklogs]
      summary: Add worklog
      operationId: addWorklog
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '201':
          description: Worklog added
  /rest/api/3/issue/{issueIdOrKey}/transitions:
    get:
      tags: [Issue Transitions]
      summary: Get transitions
      operationId: getTransitions
      parameters:
        - $ref: '#/components/parameters/IssueIdOrKey'
      responses:
        '200':
          description: Transitions returned
components:
  parameters:
    IssueIdOrKey:
      in: path
      name: issueIdOrKey
      required: true
      schema:
        type: string
      description: Numeric ID or human key of the issue
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Email + API token via HTTP Basic auth.
    OAuth2:
      type: oauth2
      description: Atlassian OAuth 2.0 (3LO) for Jira Cloud.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.atlassian.com/authorize
          tokenUrl: https://auth.atlassian.com/oauth/token
          scopes:
            read:jira-work: Read Jira work
            write:jira-work: Write Jira work
            read:jira-user: Read Jira user
            manage:jira-project: Manage Jira projects
security:
  - basicAuth: []
  - OAuth2: []
