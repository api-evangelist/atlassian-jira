- name: jira.js
  registry: npm
  official: false
  language: typescript
  url: https://www.npmjs.com/package/jira.js
  repository: https://github.com/MrRefactoring/jira.js
  version: 6.2.0
  published: '2026-08-24'
  note: The de-facto JavaScript/TypeScript Jira client. Actively maintained, but community-owned.
- name: jira
  registry: pypi
  official: false
  language: python
  url: https://pypi.org/project/jira/
  repository: https://github.com/pycontribs/jira
  version: 3.10.5
  published: '2025-07-28'
  note: The pycontribs Jira library — the most widely used Python client. Community-owned; last release
    over a year before this check.
- name: atlassian-python-api
  registry: pypi
  official: false
  language: python
  url: https://pypi.org/project/atlassian-python-api/
  repository: https://github.com/atlassian-api/atlassian-python-api
  version: 5.0.4
  published: '2026-08-28'
  note: |
    Named `atlassian-api` on GitHub and `atlassian-python-api` on PyPI, which reads as first-party and
    is not — the maintainer of record is Matt Harasymczuk, not Atlassian. Actively maintained.
- name: jira-client
  registry: npm
  official: false
  language: javascript
  url: https://www.npmjs.com/package/jira-client
  version: 8.2.2
  published: '2022-11-03'
  note: Older community wrapper; last published 2022.
- name: atlassian-mcp-server
  registry: npm
  official: false
  language: javascript
  url: https://www.npmjs.com/package/atlassian-mcp-server
  repository: https://github.com/teo-lin/multi-llm-mcps
  version: 1.0.1
  published: '2025-12-12'
  note: |
    Not Atlassian's, despite the name. Atlassian's MCP product is the hosted endpoint recorded in
    mcp/atlassian-jira-mcp.yml; it ships no first-party stdio MCP package.
official_package_count: 9
third_party_package_count: 5
