cross_cutting_rules_taught:
- Atlassian Document Format is required for every rich-text body in v3; a plain string is a 400.
- There is no idempotency key on any Jira write — read before you retry.
- Errors are an Atlassian ErrorCollection envelope, not RFC 9457 problem+json.
- 429 carries RateLimit-Reason; the four reasons need four different backoff strategies.
- Jira meters an hourly points budget, where a read costs 1 point per object returned.
- deleteIssue has no REST restore path and no documented retention window.
