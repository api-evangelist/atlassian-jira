findings:
- A PGP-signed security.txt is served on every Atlassian host probed, canonical at
  https://www.atlassian.com/.well-known/security.txt, with Contact, Policy, Encryption, Expires
  (2027-02-04) and Hiring fields — a complete RFC 9116 document.
- auth.atlassian.com serves both OpenID Connect discovery and RFC 8414 OAuth authorization server
  metadata, including a pushed authorization request endpoint and private_key_jwt client auth.
- mcp.atlassian.com serves RFC 8414 authorization server metadata with dynamic client registration
  (RFC 7591) and an RFC 9728 protected-resource document for the remote MCP endpoint, whose
  scopes_supported list is the authoritative scope set for MCP callers.
- No agent card (A2A) is published on any Atlassian host. The 404 bodies are genuine 404s, not SPA
  shells answering 200.
- No /.well-known/api-catalog and no /.well-known/ai-plugin.json anywhere.
