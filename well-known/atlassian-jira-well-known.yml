source: |
  Direct unauthenticated HTTPS probes run 2026-09-06 against every host this record knows: the
  registrable domain and www, the docs host, the OAuth 2.0 (3LO) authorization host named in the
  OpenAPI securitySchemes, the Atlassian API gateway host, and the remote MCP host named on
  https://www.atlassian.com/platform/remote-mcp-server. The tenant server in the OpenAPI
  (your-domain.atlassian.net) is a templated per-customer host and was not probed.
